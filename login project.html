<!DOCTYPE html>
<html>     
<head>      
<title>MUST login form</title>
<link rel="stylesheet" href="style.css">

</head>
<body>  
<div class="Login-container">
	<h1>MUST login</h1>
	<p>Hullo! Please login to continue.</p>
		<form action="/auth/login" method="post">
			<label for="username">Username</label>
			<input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
			<label for="password">Password</label>
			<input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
			<label for="email">Email</label>
			<input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
			<button type="submit">Sign In</button>
			<div class="links">
			<a href="#forgot-password">Forgot your password?</a>
		</div>  
		<div class="divider">How to the portal?</div>
		<div class="bottom-btns">
		<a href="account.html" class="blue">+ Create Account</a>
		<a href="#how-to-apply">How to Apply</a>
		</div>                                       
	</form>
	<p class="footer">MUST login form Welcome </p >
</div>

</body>
</html>
